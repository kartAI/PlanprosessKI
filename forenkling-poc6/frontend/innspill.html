<!--Forside/startside for opplasting av filer-->
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trenger du hjelp med å skrive et innspill?</title>
<link rel="stylesheet" href="../../css/style.css">
</head>

<body class="page-with-header">
<!--Header som viser oversikt over de forskjellige sidefanene-->
<div id="header"></div>

<div class="POC5-container">
<h1>Skriv ned ditt innspill</h1>

<form id="innspillForm">
    <div class="innspill-box">
            <textarea id="innspillInput" name="innspillInput" rows="6" cols="50" placeholder="Skriv innspill her..."></textarea>
    </div>
    <button type="submit" id="analyseTextBtn" class="analyse-btn">Be KI om hjelp</button>
</form>
</div>

<script type="module" src="js/innspill.js"></script>
</body>

</html>
