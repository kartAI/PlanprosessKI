<!--Forside/startside for opplasting av filer-->
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Få en enklere forklaring på planen</title>
<link rel="stylesheet" href="../../css/style.css">
</head>

<body class="page-with-header">
<!--Header som viser oversikt over de forskjellige sidefanene-->
<div id="header"></div>

<div class="container">
<h1>Last opp PDF‑filen du vil gjøre enklere</h1>

<form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
    <div class="upload-grid">
        <div class="upload-box">
            <h3>Forenkling av planbeskrivelse</h3>
            <input type="file" name="forenkling" id="forenkling" accept=".pdf" multiple>
            <label for="forenkling" class="upload-label">Velg fil</label>
            <p class="file-name" id="forenkling-name">Ingen fil valgt</p>
        </div>

    </div>

    <button type="submit" class="analyse-btn">Forklar planbeskrivelsen for meg</button>
</form>
</div>

<!-- kobling til JavaScript for håndtering av filvalg og innsending -->
<script src="js/script.js"></script>
</body>

</html>
